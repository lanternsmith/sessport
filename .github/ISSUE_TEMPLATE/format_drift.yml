name: Session format changed
description: A new Claude Code / Codex CLI / Gemini CLI release writes sessions sessport cannot read or resume
labels: [format-drift]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options: [Claude Code, Codex CLI, Gemini CLI, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version where it broke
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What changed?
      description: Error output, and if possible the shape of the new records (keys only is fine).
    validations:
      required: true
