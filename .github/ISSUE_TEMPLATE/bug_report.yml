name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Command you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `sessport doctor` plus the version of the source/target CLI (e.g. `codex --version`).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15 / Ubuntu 24.04 / Windows 11
  - type: textarea
    id: sample
    attributes:
      label: Minimal session sample (optional)
      description: A few JSONL lines that reproduce the issue. Remove private content first; `sessport export <id> --format json` redacts common secrets.
      render: json
